[project]
name = "llama_ros"
version = "6.0.11"
description = "ROS 2 packages to integrate llama.cpp into ROS 2"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.4.2",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-core==1.6.4",
    "langchain-openai==1.6.3",
    "langchain-text-splitters==1.1.2",
    "langgraph-prebuilt==1.1.0",
    "pydantic==2.13.5",
    "opencv-python==4.11.0.86",
]

[tool.uv]
package = false
override-dependencies = ["onnxruntime<1.21", "numpy<2"]
