/**:
  ros__parameters:
    # Model parameters
    model:
      repo: ggml-org/Clef-Flash-GGUF
      filename: Clef-Flash-Q4_K_M.gguf

    # Multimodal projector parameters
    mmproj:
      repo: ggml-org/Clef-Flash-GGUF
      filename: mmproj-Clef-Flash-Q8_0.gguf

    # Context / inference parameters
    context:
      n_ctx: 8192
      n_batch: 2048
      n_predict: 2048
      pooling_type: none

    # GPU / backend parameters
    gpu:
      n_gpu_layers: -1

    # CPU parameters
    cpu:
      n_threads: -1
