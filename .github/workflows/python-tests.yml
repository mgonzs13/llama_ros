name: Python Client Tests

on: [push, pull_request]

jobs:
  python_client_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test CLI cancellation and response handling
        run: python -m unittest discover -s llama_cli/test -p test_prompt_cancellation.py -v
